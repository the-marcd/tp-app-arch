# Full control of the website namespace, for the user created by
# user_setup/create-user-csr.sh.
#
# Wildcards on all three axes: any API group, any resource, any verb -- but
# namespaced, so it stops at the website namespace boundary. Cluster-scoped
# objects (Nodes, PersistentVolumes, CRDs, the Namespace itself) are untouched,
# because a Role cannot grant access to them however broad its rules.
#
# Two things this does include, worth knowing:
#   - Secrets in this namespace, including the TLS key cert-manager writes.
#   - RoleBindings in this namespace. RBAC's escalation check stops the holder
#     granting more than they have, so this cannot be used to reach outside the
#     namespace -- but they can hand namespace-level access to others.
#
# The built-in "admin" ClusterRole is the conventional alternative, bound with a
# RoleBinding. It is slightly narrower: it withholds ResourceQuota and the
# Namespace object, and it does not cover CRDs added after it was defined. Swap
# to it by setting roleRef.kind to ClusterRole and name to admin in
# website-rolebinding.yaml, and deleting this file.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: website-editor
  namespace: website
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"

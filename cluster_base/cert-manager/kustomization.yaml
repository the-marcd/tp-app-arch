apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Upstream release manifest, pinned. Bump deliberately: a new release can rename
# the Deployment or its container, which would make the patch below a silent
# no-op rather than an error.
resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.21.2/cert-manager.yaml

patches:
  - path: irsa-patch.yaml

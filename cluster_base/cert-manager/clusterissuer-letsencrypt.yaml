# ACME issuers solving DNS-01 against the tp.darcsaint.net zone.
#
# The route53 block carries no accessKeyID/secretAccessKey: cert-manager uses
# ambient credentials, which it applies to ClusterIssuer resources by default
# (Issuer resources would additionally need --issuer-ambient-credentials). It
# finds the role and region from the environment variables the IRSA patch sets
# on the controller pod.
#
# hostedZoneID is set so cert-manager does not have to resolve the domain to a
# zone -- which is also what makes the ResolveZoneByName statement in the
# cert-manager IAM policy droppable.
#
# Both issuers are defined; pick per Certificate via issuerRef. Production has
# hard rate limits -- roughly 5 failed validations per account, hostname and hour
# -- and failed DNS-01 attempts count against them, so staging is the one to
# point at while debugging an issuance problem.
#
# The contact address is registered with Let's Encrypt as the ACME account
# contact and receives expiry notices. It only reaches anyone if the zone has an
# MX record pointing somewhere that accepts mail.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@tp.darcsaint.net
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            hostedZoneID: Z0682799BUTOTN2MXMM1
        selector:
          dnsZones:
            - tp.darcsaint.net
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@tp.darcsaint.net
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            hostedZoneID: Z0682799BUTOTN2MXMM1
        selector:
          dnsZones:
            - tp.darcsaint.net

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Upstream release manifest, pinned. Note it contains cert-manager Certificate
# and Issuer resources for the admission webhook, so cert-manager must be
# installed and its CRDs established before this is applied.
resources:
  - https://github.com/kubernetes-sigs/aws-load-balancer-controller/releases/download/v3.5.0/v3_5_0_full.yaml

patches:
  - path: irsa-and-flags-patch.yaml

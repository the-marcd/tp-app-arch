apiVersion: v1
kind: ConfigMap
metadata:
  name: site-html
  namespace: website
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>site.tp.darcsaint.net</title>
        <style>
          body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 34rem;
                 padding: 0 1rem; line-height: 1.5; color: #1a1a1a; }
          code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 3px; }
        </style>
      </head>
      <body>
        <h1>site.tp.darcsaint.net</h1>
        <p>Served by nginx from a ConfigMap, behind a Network Load Balancer,
           over a Let's Encrypt certificate issued by cert-manager.</p>
        <p>Edit <code>configmap-html.yaml</code> and reapply to change this page.
           nginx reads it from a mounted volume, so a rollout restart picks it up:
           <code>kubectl -n website rollout restart deploy/site</code>.</p>
      </body>
    </html>

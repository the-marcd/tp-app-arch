# cert-manager issues this into the Secret named below, solving DNS-01 against
# the tp.darcsaint.net zone with the IRSA role from infra/irsa.tf.
#
# letsencrypt-prod, so the certificate chains to a trusted root and browsers do
# not warn. Production rate limits are real: roughly 5 failed validations per
# account, hostname and hour, and 50 certificates per registered domain per
# week. A misconfiguration burns through the failure budget rather than just
# retrying, so if this stops issuing, switch issuerRef to letsencrypt-staging
# while debugging and switch back once it works.
#
# The Deployment mounts this Secret, so pods stay in ContainerCreating until the
# certificate is issued. Watch it with:
#   kubectl -n website describe certificate site-tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-tls
  namespace: website
spec:
  secretName: site-tls
  dnsNames:
    - site.tp.darcsaint.net
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

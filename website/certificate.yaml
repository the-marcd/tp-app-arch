# cert-manager issues this into the Secret named below, solving DNS-01 against
# the tp.darcsaint.net zone with the IRSA role from infra/irsa.tf.
#
# Points at letsencrypt-staging deliberately. Staging certificates are signed by
# an untrusted root, so a browser will warn -- but production has hard rate
# limits and failed DNS-01 attempts count against them. Switch the issuerRef to
# letsencrypt-prod once a staging certificate has issued cleanly, and delete the
# Secret so a new one is requested.
#
# The Deployment mounts this Secret, so pods stay in ContainerCreating until the
# certificate is issued. Watch it with:
#   kubectl -n website describe certificate site-tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: site-tls
  namespace: website
spec:
  secretName: site-tls
  dnsNames:
    - site.tp.darcsaint.net
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
